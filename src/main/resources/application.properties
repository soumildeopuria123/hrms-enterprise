spring.application.name=hrms-enterprise

# Database
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/hrms}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:secret}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.servlet.context-path=/api

# HRMS-specific
hrms.demo-mode=false
hrms.default-tenant-id=00000000-0000-0000-0000-000000000001
hrms.leave-grace-days=0
hrms.working-hours.start=09:00
hrms.working-hours.end=18:00
